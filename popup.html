<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IP Probe</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0a0028;
      color: #00ffff;
      margin: 0;
      padding: 18px 24px;
      min-width: 340px;
      text-align: center;
      user-select: none;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 1.4em;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #ff00ff;
    }
    #ip {
      font-size: 2.1em;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 12px 0 8px;
      word-break: break-all;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
    }
    #location {
      font-size: 1.05em;
      color: #ff66ff;
      margin-bottom: 12px;
      text-shadow: 0 0 6px #ff00ff;
    }
    #map-container {
      width: 100%;
      height: 200px;
      margin: 12px 0;
      border: 1px solid #ff00ff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 12px #ff00ff55;
      background: #111;
    }
    #map-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #status {
      font-size: 0.9em;
      opacity: 0.7;
      margin-top: 8px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      background: #ff00ff22;
      color: #00ffff;
      border: 1px solid #ff00ff;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #ff00ff44; }
  </style>
</head>
<body>
  <h2>NEON IP PROBE</h2>
  <div id="ip">… fetching …</div>
  <div id="location">…</div>
  
  <div id="map-container">
    <!-- Hier komt de kaart -->
  </div>
  
  <div id="status">Last update: never</div>
  <button id="refresh">Refresh Now</button>

  <script src="popup.js"></script>
</body>
</html>
